name: Tidewarden

on:
  schedule:
    # every 5 hours (300 minutes)
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: tidewarden-runner
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    # Must not exceed the 300-minute schedule, or the next run starts while this
    # one is still alive and both answer the same command.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run Tidewarden
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PYTHONUNBUFFERED: "1"
          # Aternos has no API: these are the panel's own session cookie and
          # server id, used to press Start when a newcomer arrives. Unset is
          # fine - /wake then just explains the panel link instead.
          ATERNOS_SESSION: ${{ secrets.ATERNOS_SESSION }}
          ATERNOS_SERVER: ${{ secrets.ATERNOS_SERVER }}
          # Turn on the Server Members intent in the Discord developer portal
          # FIRST, then add this repository variable, or the bot cannot log in.
          ENABLE_MEMBER_INTENT: ${{ vars.ENABLE_MEMBER_INTENT }}
          # The bot saves and closes itself at this point.
          RUN_BUDGET_MINUTES: "285"
        run: python odyssey_bot.py
        timeout-minutes: 290

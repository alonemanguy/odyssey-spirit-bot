name: Tidewarden

on:
  schedule:
    # every 5 hours (300 minutes)
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: tidewarden-runner
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    # Must not exceed the 300-minute schedule, or the next run starts while this
    # one is still alive and both answer the same command.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run Tidewarden
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PYTHONUNBUFFERED: "1"
          # The bot saves and closes itself at this point.
          RUN_BUDGET_MINUTES: "285"
        run: python odyssey_bot.py
        timeout-minutes: 290
